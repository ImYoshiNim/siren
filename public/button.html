<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siren Button</title>
  <style>
    :root { --bg: #f6f6f4; --fg: #1c1c1c; --muted: #6b6b6b; --accent: #c62828; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #eee; --muted: #9a9a9a; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font: 16px/1.5 system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 16px;
    }
    #big {
      width: min(70vw, 280px); aspect-ratio: 1; border-radius: 50%; border: 0;
      background: var(--accent); color: #fff; font: 700 28px system-ui, sans-serif;
      cursor: pointer; box-shadow: 0 10px 0 #7f1414, 0 14px 30px rgba(0,0,0,.3);
      transition: transform .05s, box-shadow .05s;
    }
    #big:active { transform: translateY(8px); box-shadow: 0 2px 0 #7f1414, 0 4px 10px rgba(0,0,0,.3); }
    #big.on { background: #555; box-shadow: 0 10px 0 #2a2a2a, 0 14px 30px rgba(0,0,0,.3); }
    #status { color: var(--muted); }
    .hidden { display: none !important; }
    #login { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; text-align: center; }
    #login h1 { margin: 0; font-size: 24px; }
    #login input, #login button {
      font: inherit; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--muted);
      background: transparent; color: var(--fg);
    }
    #login button { background: var(--accent); border: 0; color: #fff; font-weight: 700; cursor: pointer; }
    #loginError { color: var(--accent); min-height: 1.5em; margin: 0; }
  </style>
</head>
<body>
  <form id="login" class="hidden">
    <h1>Password</h1>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
    <button type="submit">Unlock</button>
    <p id="loginError"></p>
  </form>

  <button id="big" class="hidden">PRESS</button>
  <div id="status" class="hidden">Connecting…</div>

  <script src="https://cdn.jsdelivr.net/npm/pusher-js@8.4.0/dist/web/pusher.min.js"></script>
  <script src="/siren.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const big = $('big');
    const status = $('status');
    let alarm = false;
    let connected = false;

    big.onclick = async () => {
      if (!(await sendAlarm(!alarm))) showLogin('Password changed — please log in again.');
    };

    function render() {
      big.classList.toggle('on', alarm);
      big.textContent = alarm ? 'TURN OFF' : 'PRESS';
      status.textContent = alarm ? 'Alarm is sounding on the home page' : 'Ready';
    }

    function showLogin(error = '') {
      savedPassword.set('');
      $('loginError').textContent = error;
      $('login').classList.remove('hidden');
      big.classList.add('hidden');
      status.classList.add('hidden');
      $('password').focus();
    }

    function showButton() {
      $('login').classList.add('hidden');
      big.classList.remove('hidden');
      status.classList.remove('hidden');
      if (connected) return;
      connected = true;
      connectSiren({
        onAlarm(on) { alarm = on; render(); },
        onStatus(text) { text ? (status.textContent = text) : render(); },
      });
    }

    $('login').onsubmit = async (e) => {
      e.preventDefault();
      const password = $('password').value;
      if (await checkPassword(password)) {
        savedPassword.set(password);
        $('password').value = '';
        showButton();
      } else {
        $('loginError').textContent = 'Wrong password';
        $('password').select();
      }
    };

    // Skip the login if no password is set, or this browser already has the right one.
    getConfig().then(async (config) => {
      if (!config.needsKey || (savedPassword.get() && (await checkPassword(savedPassword.get())))) showButton();
      else showLogin();
    });
  </script>
</body>
</html>
