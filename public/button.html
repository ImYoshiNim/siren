<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siren Button</title>
  <style>
    :root { --bg: #f6f6f4; --fg: #1c1c1c; --muted: #6b6b6b; --accent: #c62828; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #eee; --muted: #9a9a9a; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font: 16px/1.5 system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 16px;
    }
    #big {
      width: min(70vw, 280px); aspect-ratio: 1; border-radius: 50%; border: 0;
      background: var(--accent); color: #fff; font: 700 28px system-ui, sans-serif;
      cursor: pointer; box-shadow: 0 10px 0 #7f1414, 0 14px 30px rgba(0,0,0,.3);
      transition: transform .05s, box-shadow .05s;
    }
    #big:active { transform: translateY(8px); box-shadow: 0 2px 0 #7f1414, 0 4px 10px rgba(0,0,0,.3); }
    #big.on { background: #555; box-shadow: 0 10px 0 #2a2a2a, 0 14px 30px rgba(0,0,0,.3); }
    #status { color: var(--muted); }
  </style>
</head>
<body>
  <button id="big">PRESS</button>
  <div id="status">Connecting…</div>

  <script src="https://cdn.jsdelivr.net/npm/pusher-js@8.4.0/dist/web/pusher.min.js"></script>
  <script src="/siren.js"></script>
  <script>
    const big = document.getElementById('big');
    const status = document.getElementById('status');
    let alarm = false;

    big.onclick = () => sendAlarm(!alarm);

    function render() {
      big.classList.toggle('on', alarm);
      big.textContent = alarm ? 'TURN OFF' : 'PRESS';
      status.textContent = alarm ? 'Alarm is sounding on the home page' : 'Ready';
    }

    connectSiren({
      onAlarm(on) { alarm = on; render(); },
      onStatus(text) { text ? (status.textContent = text) : render(); },
    });
  </script>
</body>
</html>
