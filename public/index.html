<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siren</title>
  <style>
    :root { --bg: #f6f6f4; --fg: #1c1c1c; --muted: #6b6b6b; --accent: #c62828; --ok: #2e7d32; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --fg: #eee; --muted: #9a9a9a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font: 16px/1.5 system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    body.alarm { animation: flash .6s steps(1) infinite; }
    @keyframes flash { 50% { background: var(--accent); color: #fff; } }
    main { width: 100%; max-width: 460px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .status { color: var(--muted); }
    .status b { color: var(--fg); }
    body.alarm .status, body.alarm .status b { color: inherit; }
    #message {
      display: none; margin: 24px 0 0; font-size: clamp(28px, 6vw, 56px);
      font-weight: 800; line-height: 1.15; text-transform: uppercase;
    }
    body.alarm #message { display: block; }
    body.alarm main { max-width: 900px; }
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; cursor: pointer; text-align: center; padding: 16px; z-index: 10;
    }
    #overlay strong { font-size: 26px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
    .dot.on { background: var(--ok); }
  </style>
</head>
<body>
  <div id="overlay">
    <strong>Click anywhere to arm</strong>
    <span>Browsers only allow sound after you interact with the page once.</span>
  </div>

  <main>
    <h1>Siren</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>

    <p id="message">Attention All WAV, Your Next Mission is to Bring Me...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pusher-js@8.4.0/dist/web/pusher.min.js"></script>
  <script src="/siren.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const audio = new Audio('/default.mp3');
    audio.loop = true;
    let alarm = false;

    function play() {
      audio.currentTime = 0;
      audio.play().catch(() => showOverlay());
    }

    function render() {
      document.body.classList.toggle('alarm', alarm);
      document.title = alarm ? '🚨 ALARM — Siren' : 'Siren';
      $('statusText').innerHTML = alarm ? '<b>ALARM ON</b>' : 'Armed and listening';
    }

    function showOverlay() { $('overlay').style.display = 'flex'; }
    $('overlay').onclick = () => {
      // Prime the <audio> element so later play() calls are allowed.
      audio.muted = true;
      audio.play().catch(() => {}).finally(() => { audio.pause(); audio.muted = false; if (alarm) play(); });
      $('overlay').style.display = 'none';
    };

    connectSiren({
      onAlarm(on) {
        if (on !== alarm) {
          alarm = on;
          alarm ? play() : audio.pause();
          // Picked up by the Siren Helper extension, if installed.
          window.postMessage({ source: 'siren', type: alarm ? 'alarm' : 'stop' }, '*');
        }
        render();
      },
      onStatus(text, connected) {
        $('dot').classList.toggle('on', connected);
        text ? ($('statusText').textContent = text) : render();
      },
    });
  </script>
</body>
</html>
